stages:
  - lint
  - test
  - security

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv/

before_script:
  - python3 -m venv .venv || python -m venv .venv
  - source .venv/bin/activate
  - pip install --upgrade pip
  - pip install -r requirements.txt
  - pip install pre-commit ruff mypy pytest pytest-cov bandit pip-audit vulture

linting:
  stage: lint
  image: python:3.11-slim
  script:
    - ruff check .
    - ruff format --check .
    - mypy . --ignore-missing-imports
    - pre-commit run --all-files

testing:
  stage: test
  image: python:3.11-slim
  script:
    - pytest
    - pytest --cov=. --cov-report=term

security:
  stage: security
  image: python:3.11-slim
  script:
    - bandit -r . -x tests
    - pip-audit
    - vulture .
    - pre-commit run --all-files
