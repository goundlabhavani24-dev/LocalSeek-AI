stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv/

before_script:
  - python3 -v || python -v
  - python3 -m venv .venv || python -m venv .venv
  - source .venv/bin/activate
  - pip install --upgrade pip
  - pip install ruff mypy pytest
  - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

linting:
  stage: lint
  image: python:3.11-slim
  script:
    - ruff check .
    - ruff format --check .
  allow_failure: false

typecheck:
  stage: lint
  image: python:3.11-slim
  script:
    - mypy . --ignore-missing-imports
  allow_failure: false

testing:
  stage: test
  image: python:3.11-slim
  script:
    - if [ -d tests ] && [ "$(ls -A tests)" ]; then pytest; else echo "No tests defined yet"; fi
  allow_failure: false
